const statusLabel = { done: '✓ Done', active: '● In progress', upcoming: 'Upcoming', tbd: 'Date TBD' };
const dateRange = t => t.milestone ? fmt(t.s) : `${fmt(t.s)} – ${fmt(t.f)}`;
const relDays = t => {
  if (t.status === 'active') return `ends in ${Math.round((t.e - TODAY) / DAY)}d`;
  const d = Math.round((t.s - TODAY) / DAY);
  return d === 0 ? 'today' : d === 1 ? 'tomorrow' : `in ${d}d`;
};

// ── Domain: first of the earliest month → first of the month after the last date
const all = [...tasks, ...events];
const minS = Math.min(...all.map(t => t.s), TODAY), maxE = Math.max(...all.map(t => t.e), TODAY);
const d0 = (() => { const d = new Date(minS); return Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), 1); })();
const d1 = (() => { const d = new Date(maxE - 1); return Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + 1, 1); })();
const pct = t => ((t - d0) / (d1 - d0)) * 100;

let state = { eval: 'All', view: 'chart' };

// ── Header bits ─────────────────────────────────────────────────────────────
document.getElementById('sub').textContent =
  `${DATA.evaluations.join(' · ')} — ${fmtY(d0)} to ${fmt(d1 - DAY, { month: 'short', year: 'numeric' })}`;
document.getElementById('asof').textContent = `Schedule as of ${fmtY(parse(DATA.updated))} · viewed ${fmtY(TODAY)}`;

const filterEl = document.getElementById('filter');
filterEl.innerHTML = ['All', ...DATA.evaluations].map(e =>
  `<button type="button" data-eval="${esc(e)}" aria-pressed="${e === state.eval}">${esc(e)}</button>`).join('');
filterEl.addEventListener('click', ev => {
  const b = ev.target.closest('button'); if (!b) return;
  state.eval = b.dataset.eval;
  filterEl.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b));
  render();
});
document.querySelectorAll('[data-view]').forEach(b => b.addEventListener('click', () => {
  state.view = b.dataset.view;
  document.querySelectorAll('[data-view]').forEach(x => x.setAttribute('aria-pressed', x === b));
  document.getElementById('chartView').classList.toggle('hidden', state.view !== 'chart');
  document.getElementById('tableView').classList.toggle('hidden', state.view !== 'table');
}));
document.getElementById('theme').addEventListener('click', () => {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  root.dataset.theme = dark ? 'light' : 'dark';
});

const usedTypes = DATA.types.filter(t => tasks.some(x => x.type === t));
document.getElementById('legend').innerHTML =
  usedTypes.map(t => `<span class="k"><span class="sw" style="--c:${typeColor(t)}"></span>${esc(t)}</span>`).join('') +
  `<span class="spacer"></span>` +
  `<span class="k"><span class="sw dia" style="--c:var(--text-secondary)"></span>Single-day</span>` +
  `<span class="k"><span class="sw tbd"></span>Date TBD</span>` +
  `<span class="k"><span class="sw ev"></span>Meetings &amp; conferences</span>` +
  `<span class="k"><span class="sw today"></span>Today</span>`;

const evals = () => state.eval === 'All' ? DATA.evaluations : [state.eval];
const byStart = (a, b) => a.s - b.s || a.f - b.f;
const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;

function renderCards() {
  document.getElementById('cards').innerHTML = evals().map(ev => {
    const ts = tasks.filter(t => t.evaluation === ev);
    const done = ts.filter(t => t.status === 'done').length;
    const next = ts.filter(t => t.status !== 'done').sort(byStart).slice(0, 3);
    const last = ts.reduce((m, t) => t.f > m.f ? t : m, ts[0]);
    return `<article class="card">
      <h2>${esc(ev)}</h2>
      <div class="meta">${done} of ${plural(ts.length, 'activity', 'activities')} complete · ${next.length ? `wraps up ${fmtY(last.f)}` : 'next steps not yet scheduled'}</div>
      <div class="progress" aria-hidden="true"><span style="width:${(done / ts.length) * 100}%"></span></div>
      <ul class="next">${next.map(t => `
        <li><span class="dot" style="--c:${typeColor(t.type)}"></span>
          <span><span class="t">${esc(t.task)}</span><br><span class="d">${dateRange(t)}${t.status === 'tbd' ? ' (TBD)' : ''}</span></span>
          <span class="in">${t.status === 'tbd' ? 'TBD' : relDays(t)}</span></li>`).join('') || '<li><span></span><span class="d">No upcoming activities scheduled yet</span></li>'}
      </ul></article>`;
  }).join('');
}

function bar(t) {
  const c = typeColor(t.type), cls = t.status;
  const end = t.milestone ? pct(t.s + DAY / 2) : pct(t.e);
  const flip = end > 82;
  const whenStyle = flip ? `left:calc(${t.milestone ? end : pct(t.s)}% - ${t.milestone ? 14 : 8}px)` : `left:calc(${end}% + ${t.milestone ? 14 : 8}px)`;
  const mark = t.milestone
    ? `<div class="ms ${cls}${t.links?.length ? ' has-links' : ''}" style="left:${end}%;--c:${c}" tabindex="0" data-id="${t.id}" aria-label="${esc(t.task)}, ${dateRange(t)}"></div>`
    : `<div class="bar ${cls}${t.links?.length ? ' has-links' : ''}" style="left:${pct(t.s)}%;width:${pct(t.e) - pct(t.s)}%;--c:${c}" tabindex="0" data-id="${t.id}" aria-label="${esc(t.task)}, ${dateRange(t)}">${
        t.status === 'active' ? `<span class="elapsed" style="width:${((TODAY - t.s) / (t.e - t.s)) * 100}%"></span>` : ''}</div>`;
  return `${mark}<span class="when ${flip ? 'flip' : ''}" style="${whenStyle}">${dateRange(t)}</span>`;
}

function renderChart() {
  // axis
  let months = '', lines = '';
  for (let d = new Date(d0); d.getTime() < d1; d.setUTCMonth(d.getUTCMonth() + 1)) {
    const t = d.getTime(), m = d.getUTCMonth();
    const showYr = m === 0 || t === d0;
    months += `<span class="mo" style="left:${pct(t)}%">${fmt(t, { month: 'short', day: undefined })}${showYr ? ` <b>${d.getUTCFullYear()}</b>` : ''}</span>`;
    if (t !== d0) lines += `<span class="gl ${m === 0 ? 'yr' : ''}" style="left:${pct(t)}%"></span>`;
  }
  const todayIn = TODAY >= d0 && TODAY < d1;
  const bands = events.map(e => `<span class="band" style="left:${pct(e.s)}%;width:${pct(e.e) - pct(e.s)}%"></span>`).join('');

  let rows = '';
  rows += `<div class="lane-head ev-head"><div class="cell-label"><h3>Meetings &amp; conferences</h3></div><div class="track"></div></div>`;
  events.slice().sort(byStart).forEach((e, i) => {
    rows += `<div class="row ev"><div class="cell-label"><span class="swatch" style="--c:var(--event-bar)"></span><span class="name">${esc(e.task)}</span></div>
      <div class="track"><div class="evbar" style="left:${pct(e.s)}%;width:${pct(e.e) - pct(e.s)}%" data-ev="${i}"></div>
      <span class="when" style="left:calc(${pct(e.e)}% + 8px)">${fmt(e.s)} – ${fmt(e.f)}</span></div></div>`;
  });
  evals().forEach(ev => {
    const ts = tasks.filter(t => t.evaluation === ev).sort(byStart);
    rows += `<div class="lane-sep"></div><div class="lane-head"><div class="cell-label"><h3>${esc(ev)}</h3>
      <div class="meta">${plural(ts.length, 'activity', 'activities')}</div></div><div class="track"></div></div>`;
    ts.forEach(t => {
      rows += `<div class="row ${t.status}"><div class="cell-label"><span class="swatch" style="--c:${typeColor(t.type)}"></span>
        <span class="name" title="${esc(t.task)}">${esc(t.task)}</span><span class="pill ${t.status}">${statusLabel[t.status]}</span></div>
        <div class="track">${bar(t)}</div></div>`;
    });
  });
  rows += `<div style="height:14px"></div>`;

  document.getElementById('chart').innerHTML = `
    <div class="axis"><div class="cell-label">Activity</div><div class="track">${months}
      ${todayIn ? `<span class="today-tag" style="left:${pct(TODAY + DAY / 2)}%">Today · ${fmt(TODAY)}</span>` : ''}</div></div>
    <div class="body"><div class="overlay">${bands}${lines}${todayIn ? `<span class="now" style="left:${pct(TODAY + DAY / 2)}%"></span>` : ''}</div>${rows}</div>`;
}

const linksHTML = t => t.links?.length
  ? `<div class="links">${t.links.map(l => `<a href="${esc(l.url)}" target="_blank" rel="noopener">↗ ${esc(l.label)}</a>`).join('')}</div>` : '';

function renderTable() {
  const ts = tasks.filter(t => evals().includes(t.evaluation)).sort(byStart);
  const evRows = events.map(e => ({ ...e, evaluation: '—', type: 'Meetings & conferences', status: e.e <= TODAY ? 'done' : 'upcoming', isEv: true }));
  const rowsAll = [...ts, ...evRows].sort(byStart);
  document.getElementById('tableView').innerHTML = `<table>
    <thead><tr><th>Evaluation</th><th>Activity</th><th>Type</th><th>Start</th><th>Finish</th><th>Status</th><th>Notes</th></tr></thead>
    <tbody>${rowsAll.map(t => `<tr class="${t.status}"${t.isEv ? '' : ` id="row-${t.id}"`}>
      <td>${esc(t.evaluation)}</td><td>${esc(t.task)}</td>
      <td><span class="tp"><i style="--c:${t.isEv ? 'var(--event-bar)' : typeColor(t.type)}"></i>${esc(t.type)}</span></td>
      <td class="date">${fmtY(t.s)}</td><td class="date">${fmtY(t.f)}</td>
      <td class="date">${t.isEv ? (t.status === 'done' ? '✓ Done' : 'Upcoming') : statusLabel[t.status]}</td>
      <td class="notes">${esc(t.notes)}${linksHTML(t)}</td></tr>`).join('')}</tbody></table>`;
}

function render() { renderCards(); renderChart(); renderTable(); }
render();

// ── Tooltip ─────────────────────────────────────────────────────────────────
const tip = document.getElementById('tip');
function tipHTML(el) {
  if (el.dataset.ev !== undefined) {
    const e = events.slice().sort(byStart)[+el.dataset.ev];
    return `<div class="k" style="--c:var(--event-bar)"><i></i>Meeting / conference</div><div class="t">${esc(e.task)}</div>
      <div class="dt">${fmtY(e.s)} – ${fmtY(e.f)}</div>${e.notes ? `<div class="n">${esc(e.notes)}</div>` : ''}`;
  }
  const t = tasks[+el.dataset.id];
  const dur = Math.round((t.e - t.s) / DAY);
  return `<div class="k" style="--c:${typeColor(t.type)}"><i></i>${esc(t.evaluation)} · ${esc(t.type)}</div>
    <div class="t">${esc(t.task)}</div>
    <div class="dt">${t.milestone ? fmtY(t.s) : `${fmtY(t.s)} → ${fmtY(t.f)} · ${dur} days`}</div>
    <div class="dt">${statusLabel[t.status]}${t.status === 'upcoming' || t.status === 'active' ? ` · ${relDays(t)}` : ''}</div>
    ${t.notes ? `<div class="n">${esc(t.notes)}</div>` : ''}
    ${t.links?.length ? `<div class="lk">${t.links.map(l => `↗ ${esc(l.label)}`).join('<br>')}<div class="hint">Click to open links in List view</div></div>` : ''}`;
}
function place(x, y) {
  const r = tip.getBoundingClientRect(), pad = 14;
  let left = x + pad, top = y + pad;
  if (left + r.width > innerWidth - 8) left = x - r.width - pad;
  if (top + r.height > innerHeight - 8) top = y - r.height - pad;
  tip.style.left = Math.max(8, left) + 'px'; tip.style.top = Math.max(8, top) + 'px';
}
const target = e => e.target.closest?.('.bar, .ms, .evbar');
document.addEventListener('mouseover', e => { const el = target(e); if (!el) return; tip.innerHTML = tipHTML(el); tip.classList.add('show'); place(e.clientX, e.clientY); });
document.addEventListener('mousemove', e => { if (target(e)) place(e.clientX, e.clientY); });
document.addEventListener('mouseout', e => { if (target(e) && !target({ target: e.relatedTarget || document.body })) tip.classList.remove('show'); });
document.addEventListener('focusin', e => { const el = target(e); if (!el) return; tip.innerHTML = tipHTML(el); tip.classList.add('show'); const r = el.getBoundingClientRect(); place(r.left, r.bottom); });
document.addEventListener('focusout', () => tip.classList.remove('show'));
function openLinks(el) {
  if (!el?.classList.contains('has-links')) return;
  tip.classList.remove('show');
  document.querySelector('[data-view="table"]').click();
  const row = document.getElementById(`row-${el.dataset.id}`);
  if (row) { row.scrollIntoView({ behavior: 'smooth', block: 'center' }); row.classList.remove('flash'); void row.offsetWidth; row.classList.add('flash'); }
}
document.addEventListener('click', e => openLinks(target(e)));
document.addEventListener('keydown', e => { if (e.key === 'Enter') openLinks(target(e)); });
</script>
</body>
</html>
